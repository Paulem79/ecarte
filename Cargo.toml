[package]
name = "ecarte"
version = "0.1.0"
edition = "2024"

[dependencies]
earcutr = "0.5.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
resvg = "0.49.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = "3.5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
